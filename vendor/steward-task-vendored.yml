# Generated from .github/workflows/steward-task-self-hosted.yml.
# Render this template with scripts/render-vendored-workflow.mjs and a verified release manifest.
name: Governed Steward task (self-hosted)
on:
  workflow_call:
    inputs:
      runner-label:
        description: Dedicated self-hosted runner label for the governed job
        required: true
        type: string
      job-timeout-minutes:
        description: Maximum governed-job duration in whole minutes (1-360)
        required: false
        type: number
        default: 15
      runtime-binding-timeout-minutes:
        description: Maximum Steward runtime-binding wait in minutes (1-360)
        required: false
        type: number
        default: 10
      workflow:
        description: Existing governed Workflow reference; mutually exclusive with invocation-path and package-path
        required: false
        type: string
        default: ""
      envelope-digest:
        description: Optional exact active User Envelope selector for any Task source
        required: false
        type: string
        default: ""
      invocation-path:
        description: Repository-relative direct-package invocation manifest path; mutually exclusive with workflow and package-path
        required: false
        type: string
        default: ""
      package-path:
        description: Repository-relative direct-package task-definition.json path; mutually exclusive with workflow and invocation-path
        required: false
        type: string
        default: ""
      execution-log:
        description: Direct-package execution log policy (off or full); accepted only with package-path
        required: false
        type: string
        default: off
      input-artifact:
        description: Artifact whose contents are materialized under in/
        required: true
        type: string
      output-artifact:
        description: Artifact created from out/
        required: true
        type: string
      steward-api-url:
        description: Steward Task API base URL
        required: true
        type: string
      identity-exchange-url:
        description: Deprecated compatibility exchange endpoint; empty discovers from Steward
        required: false
        type: string
        default: ""
      identity-exchange-audience:
        description: Exact audience for identity-exchange-url; omission uses a deprecated compatibility default
        required: false
        type: string
        default: ""
      steward-ca-certificate-file:
        description: Deprecated compatibility CA path; empty uses system trust
        required: false
        type: string
        default: ""
      agent-runtime:
        description: Existing AgentRuntime UID to adopt for the existing Workflow path only
        required: false
        type: string
        default: ""
    outputs:
      outcome:
        description: Action result, exactly success or failure
        value: ${{ jobs.governed.outputs.outcome }}
      failure-category:
        description: Bounded steward-run failure category; empty on success
        value: ${{ jobs.governed.outputs.failure-category }}
      http-status:
        description: HTTP status for a classified Steward or Identity exchange failure; empty otherwise
        value: ${{ jobs.governed.outputs.http-status }}
      status:
        description: Terminal Steward Task phase
        value: ${{ jobs.governed.outputs.status }}
      task-uid:
        description: Steward Task UID
        value: ${{ jobs.governed.outputs.task-uid }}
      runtime-uid:
        description: AgentRuntime UID
        value: ${{ jobs.governed.outputs.runtime-uid }}
jobs:
  governed:
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    permissions:
      contents: read
      id-token: write
    outputs:
      outcome: ${{ steps.task.outputs.outcome }}
      failure-category: ${{ steps.task.outputs.failure-category }}
      http-status: ${{ steps.task.outputs.http-status }}
      status: ${{ steps.task.outputs.status }}
      task-uid: ${{ steps.task.outputs.task-uid }}
      runtime-uid: ${{ steps.task.outputs.runtime-uid }}
    steps:
      - name: Validate job timeout
        shell: bash
        env:
          JOB_TIMEOUT_MINUTES: ${{ inputs.job-timeout-minutes }}
        run: |
          set -euo pipefail
          if [[ ! "$JOB_TIMEOUT_MINUTES" =~ ^[0-9]+$ ]] ||
             (( JOB_TIMEOUT_MINUTES < 1 || JOB_TIMEOUT_MINUTES > 360 )); then
            echo "::error::job-timeout-minutes must be an integer from 1 through 360"
            exit 1
          fi
      - id: caller-source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: inputs.invocation-path != '' || inputs.package-path != ''
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.input-artifact }}
          path: in
      - id: task
        uses: STEWARD_RUN_OWNER/STEWARD_RUN_REPOSITORY@STEWARD_RUN_ACTION_COMMIT
        with:
          workflow: ${{ inputs.workflow }}
          envelope-digest: ${{ inputs.envelope-digest }}
          invocation-path: ${{ inputs.invocation-path }}
          package-path: ${{ inputs.package-path }}
          execution-log: ${{ inputs.execution-log }}
          inputs: in
          outputs: out
          steward-api-url: ${{ inputs.steward-api-url }}
          identity-exchange-url: ${{ inputs.identity-exchange-url }}
          identity-exchange-audience: ${{ inputs.identity-exchange-audience }}
          steward-ca-certificate-file: ${{ inputs.steward-ca-certificate-file }}
          agent-runtime: ${{ inputs.agent-runtime }}
          runtime-binding-timeout-minutes: ${{ inputs.runtime-binding-timeout-minutes }}
      - name: Require governed outputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d out ]] || ! find out -type f -print -quit | grep -q .; then
            echo "::error::the task wrote nothing to out/"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.output-artifact }}
          path: out
          if-no-files-found: error
