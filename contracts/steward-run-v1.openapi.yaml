openapi: 3.1.0
info:
  title: Steward Task API
  version: 1.0.0
  description: >-
    Task submission lifecycle consumed by steward-run. Bearer assertions must be
    issued for the steward-task-api audience and mapped to Steward service and
    acting-user identity groups before they reach this API.
servers:
  - url: https://steward.invalid
security:
  - bearerAuth: []
paths:
  /v1/tasks:
    post:
      operationId: submitTask
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskSubmissionRequest'
      responses:
        '201':
          description: Task admitted or idempotently returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskStatusResponse' }
        '202':
          description: >-
            Task accepted for controller-owned runtime binding or parked for approval; runtimeUid
            is null until the controller binds the exact runtime UID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskStatusResponse' }
        '400': { $ref: '#/components/responses/Invalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Invalid' }
  /v1/tasks/{taskUid}/inputs:
    parameters:
      - $ref: '#/components/parameters/TaskUid'
    put:
      operationId: uploadTaskInputs
      requestBody:
        required: true
        content:
          application/x-tar:
            schema:
              type: string
              contentMediaType: application/x-tar
              contentEncoding: binary
              maxLength: 67108864
      responses:
        '204': { description: Input archive accepted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Archive exceeds the 64 MiB server limit }
        '415': { description: Content-Type is not application/x-tar }
        '422': { $ref: '#/components/responses/Invalid' }
  /v1/tasks/{taskUid}/execute:
    parameters:
      - $ref: '#/components/parameters/TaskUid'
    post:
      operationId: executeTask
      responses:
        '202':
          description: Desired execution recorded durably
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tasks/{taskUid}:
    parameters:
      - $ref: '#/components/parameters/TaskUid'
    get:
      operationId: getTask
      responses:
        '200':
          description: Current Task state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: finalizeTask
      description: Terminates a provisioned runtime or detaches an adopted runtime.
      responses:
        '202':
          description: Desired cleanup recorded durably
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/tasks/{taskUid}/outputs:
    parameters:
      - $ref: '#/components/parameters/TaskUid'
    get:
      operationId: downloadTaskOutputs
      responses:
        '200':
          description: Workspace-relative Task outputs, limited to 67108864 bytes
          content:
            application/x-tar:
              schema:
                type: string
                contentMediaType: application/x-tar
                contentEncoding: binary
                maxLength: 67108864
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Outputs are not ready }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: TokenReview assertion with the steward-task-api audience
  parameters:
    TaskUid:
      name: taskUid
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 32, maxLength: 64 }
  responses:
    Unauthorized: { description: Missing, invalid, or unauthorized bearer identity }
    Conflict: { description: Request conflicts with the current Task state }
    Invalid: { description: Request or archive failed validation }
    NotFound: { description: Task not found for this identity }
  schemas:
    TaskSubmissionRequest:
      type: object
      additionalProperties: false
      required: [workflow, codingAgentRuntime]
      properties:
        workflow: { type: string, minLength: 1 }
        codingAgentRuntime: { type: string, minLength: 1 }
        agentRuntimeUid: { type: string, minLength: 1 }
    TaskPhase:
      type: string
      enum: [submitted, parked, queued, running, succeeded, failed, cancelled]
    RuntimeOwnership:
      type: string
      enum: [provisioned, adopted]
    ModelRef:
      type: object
      additionalProperties: false
      required: [provider, model]
      properties:
        provider: { type: string, minLength: 1 }
        model: { type: string, minLength: 1 }
    ToolGrant:
      type: object
      additionalProperties: false
      required: [provider, resource, action]
      properties:
        provider: { type: string, minLength: 1 }
        resource: { type: string, minLength: 1 }
        action: { type: string, minLength: 1 }
    TaskAdmissionDelta:
      oneOf:
        - type: object
          additionalProperties: false
          required: [dimension, requested, ceiling, currency]
          properties:
            dimension: { const: budget }
            requested: { type: string }
            ceiling: { type: string }
            currency: { type: string }
        - type: object
          additionalProperties: false
          required: [dimension, requested, ceiling]
          properties:
            dimension: { const: ttl }
            requested: { type: string }
            ceiling: { type: string }
        - type: object
          additionalProperties: false
          required: [dimension, requested, ceiling]
          properties:
            dimension: { const: models }
            requested:
              type: array
              items: { $ref: '#/components/schemas/ModelRef' }
            ceiling:
              type: array
              items: { $ref: '#/components/schemas/ModelRef' }
        - type: object
          additionalProperties: false
          required: [dimension, requested, ceiling]
          properties:
            dimension: { const: tools }
            requested:
              type: array
              items: { $ref: '#/components/schemas/ToolGrant' }
            ceiling:
              type: array
              items: { $ref: '#/components/schemas/ToolGrant' }
    TaskStatusResponse:
      type: object
      additionalProperties: false
      required: [taskUid, runtimeUid, phase, runtimeOwnership, finalized]
      properties:
        taskUid: { type: string, format: uuid }
        runtimeUid:
          description: >-
            Immutable Kubernetes runtime UID. Null is valid for a provisioned Task while it is
            waiting for controller-owned binding in non-final submitted, parked, or queued phase,
            and remains null if that unbound Task is cancelled and finalized before binding.
          oneOf:
            - { type: string, minLength: 1 }
            - { type: 'null' }
        phase: { $ref: '#/components/schemas/TaskPhase' }
        runtimeOwnership: { $ref: '#/components/schemas/RuntimeOwnership' }
        finalized:
          type: boolean
          description: True after provisioned termination or adopted-runtime detachment completes.
        failureReason: { type: string }
        deltas:
          type: array
          items: { $ref: '#/components/schemas/TaskAdmissionDelta' }
