name: steward-run
description: Run a governed coding-agent workflow in a Steward sandbox

inputs:
  workflow:
    description: Governed workflow to execute
    required: true
  inputs:
    description: Newline-delimited workspace-relative input paths
    required: true
  outputs:
    description: Newline-delimited workspace-relative output paths
    required: true
  steward-api-url:
    description: Steward control-plane API base URL
    required: true
  steward-ca-certificate-file:
    description: Filesystem path to a PEM CA bundle trusted for the Steward API
    required: false
  identity-exchange-url:
    description: HTTPS endpoint that exchanges GitHub OIDC for a short-lived Steward token
    required: false
  identity-exchange-audience:
    description: Optional exact GitHub OIDC audience accepted by the configured Identity exchange
    required: false
  oidc-audience:
    description: Test-only direct GitHub OIDC audience; allowed only with a loopback Steward API
    required: false
  bearer-token-file:
    description: Filesystem path containing a rotating short-lived JWT; mutually exclusive with OIDC inputs
    required: false
  agent-runtime:
    description: Existing AgentRuntime UID to adopt instead of provisioning one
    required: false
outputs:
  status:
    description: Terminal Steward Task phase
    value: ${{ steps.steward-run.outputs.status }}
  task-uid:
    description: Steward Task UID for audit correlation
    value: ${{ steps.steward-run.outputs.task-uid }}
  runtime-uid:
    description: Provisioned or adopted AgentRuntime UID
    value: ${{ steps.steward-run.outputs.runtime-uid }}

runs:
  using: composite
  steps:
    - id: steward-run
      shell: bash
      env:
        STEWARD_RUN_WORKFLOW: ${{ inputs.workflow }}
        STEWARD_RUN_INPUTS: ${{ inputs.inputs }}
        STEWARD_RUN_OUTPUTS: ${{ inputs.outputs }}
        STEWARD_RUN_API_URL: ${{ inputs.steward-api-url }}
        STEWARD_RUN_CA_CERTIFICATE_FILE: ${{ inputs.steward-ca-certificate-file }}
        STEWARD_RUN_IDENTITY_EXCHANGE_URL: ${{ inputs.identity-exchange-url }}
        STEWARD_RUN_IDENTITY_EXCHANGE_AUDIENCE: ${{ inputs.identity-exchange-audience }}
        STEWARD_RUN_OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
        STEWARD_RUN_BEARER_TOKEN_FILE: ${{ inputs.bearer-token-file }}
        STEWARD_RUN_AGENT_RUNTIME: ${{ inputs.agent-runtime }}
      run: exec node "$GITHUB_ACTION_PATH/dist/index.cjs"
