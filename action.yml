name: steward-run
description: Run a governed coding-agent workflow in a Steward sandbox

inputs:
  workflow:
    description: Existing governed Workflow reference; mutually exclusive with invocation-path
    required: false
  envelope-digest:
    description: Optional exact active User Envelope selector for either Task source
    required: false
    default: ""
  invocation-path:
    description: Repository-relative direct-package invocation manifest path; mutually exclusive with workflow
    required: false
  inputs:
    description: Newline-delimited workspace-relative input paths
    required: true
  outputs:
    description: Newline-delimited workspace-relative output paths
    required: true
  steward-api-url:
    description: Steward control-plane API base URL
    required: true
  steward-ca-certificate-file:
    description: Deprecated compatibility path to a PEM CA bundle for Steward and Identity; empty uses system trust
    required: false
    default: ""
  identity-exchange-url:
    description: Deprecated compatibility exchange endpoint; empty discovers authentication from Steward
    required: false
    default: ""
  identity-exchange-audience:
    description: Exact GitHub OIDC audience for identity-exchange-url; omission uses a deprecated compatibility default
    required: false
    default: ""
  oidc-audience:
    description: Test-only direct GitHub OIDC audience; allowed only with a loopback Steward API
    required: false
  bearer-token-file:
    description: Filesystem path containing a rotating short-lived JWT; mutually exclusive with OIDC inputs
    required: false
  agent-runtime:
    description: Existing AgentRuntime UID to adopt for the existing Workflow path only
    required: false
  runtime-binding-timeout-minutes:
    description: Maximum wait for Steward to bind a runtime, as an integer from 1 through 360
    required: false
    default: "10"
outputs:
  outcome:
    description: Action result, exactly success or failure
    value: ${{ steps.steward-run.outputs.outcome }}
  failure-category:
    description: Bounded steward-run failure category; empty on success
    value: ${{ steps.steward-run.outputs.failure-category }}
  http-status:
    description: HTTP status for a classified Steward or Identity exchange failure; empty otherwise
    value: ${{ steps.steward-run.outputs.http-status }}
  status:
    description: Terminal Steward Task phase
    value: ${{ steps.steward-run.outputs.status }}
  task-uid:
    description: Steward Task UID for audit correlation
    value: ${{ steps.steward-run.outputs.task-uid }}
  runtime-uid:
    description: Provisioned or adopted AgentRuntime UID
    value: ${{ steps.steward-run.outputs.runtime-uid }}

runs:
  using: composite
  steps:
    - name: Detect Node.js 24
      id: node24
      shell: bash
      run: |
        set -euo pipefail
        if command -v node >/dev/null 2>&1 && node --version 2>/dev/null | grep -Eq '^v24\.'; then
          printf 'available=true\n' >> "$GITHUB_OUTPUT"
        else
          printf 'available=false\n' >> "$GITHUB_OUTPUT"
        fi
    - name: Set up Node.js 24
      if: steps.node24.outputs.available != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.21.0
        package-manager-cache: false
    - id: steward-run
      shell: bash
      env:
        STEWARD_RUN_WORKFLOW: ${{ inputs.workflow }}
        STEWARD_RUN_ENVELOPE_DIGEST: ${{ inputs.envelope-digest }}
        STEWARD_RUN_INVOCATION_PATH: ${{ inputs.invocation-path }}
        STEWARD_RUN_INPUTS: ${{ inputs.inputs }}
        STEWARD_RUN_OUTPUTS: ${{ inputs.outputs }}
        STEWARD_RUN_API_URL: ${{ inputs.steward-api-url }}
        STEWARD_RUN_CA_CERTIFICATE_FILE: ${{ inputs.steward-ca-certificate-file }}
        STEWARD_RUN_IDENTITY_EXCHANGE_URL: ${{ inputs.identity-exchange-url }}
        STEWARD_RUN_IDENTITY_EXCHANGE_AUDIENCE: ${{ inputs.identity-exchange-audience }}
        STEWARD_RUN_OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
        STEWARD_RUN_BEARER_TOKEN_FILE: ${{ inputs.bearer-token-file }}
        STEWARD_RUN_AGENT_RUNTIME: ${{ inputs.agent-runtime }}
        STEWARD_RUN_RUNTIME_BINDING_TIMEOUT_MINUTES: ${{ inputs.runtime-binding-timeout-minutes }}
      run: exec node "$GITHUB_ACTION_PATH/dist/index.cjs"
