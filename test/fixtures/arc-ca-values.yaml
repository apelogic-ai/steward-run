gha-runner-scale-set:
  githubConfigUrl: https://github.com/customer/example
  githubConfigSecret: steward-run-github-app
  controllerServiceAccount:
    namespace: arc-system
    name: arc-gha-rs-controller
  template:
    spec:
      volumes:
        - name: steward-run-trust-bundle
          configMap:
            name: steward-run-ca
            items:
              - key: ca.crt
                path: ca.crt
      containers:
        - name: runner
          image: registry.example/steward-run@sha256:b818f4eda4cb3610c7efbe9ec93c432155bb44af676e8443aa06139b98b5ad32
          imagePullPolicy: IfNotPresent
          command: ["/home/runner/run.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            privileged: false
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: steward-run-trust-bundle
              mountPath: /etc/steward-run/trust
              readOnly: true
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/steward-run/trust/ca.crt
