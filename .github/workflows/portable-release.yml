name: Portable OSS release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      operation:
        description: Build a pre-tag runner image or resume a tagged release
        required: true
        default: release
        type: choice
        options:
          - release
          - bootstrap
      version:
        description: Semantic version matching package.json and the application chart
        required: true
        type: string
      resume_image_digest:
        description: Exact existing image digest when resuming an interrupted publication
        required: false
        default: ""
        type: string
      resume_chart_digest:
        description: Exact existing chart digest when resuming an interrupted publication
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'bootstrap' }}
    runs-on: ${{ vars.STEWARD_RUN_RELEASE_AMD64_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.refs.outputs.version }}
      image: ${{ steps.refs.outputs.image }}
      tag: ${{ steps.refs.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Validate bootstrap coordinates
        id: refs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RESUME_IMAGE_DIGEST: ${{ inputs.resume_image_digest }}
          RESUME_CHART_DIGEST: ${{ inputs.resume_chart_digest }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/* ]]
          [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ -z "$RESUME_IMAGE_DIGEST" ]]
          [[ -z "$RESUME_CHART_DIGEST" ]]
          [[ "$(node -p 'require("./package.json").version')" == "$INPUT_VERSION" ]]
          [[ "$(sed -n 's/^version: //p' charts/steward-run-arc/Chart.yaml | head -1)" == "$INPUT_VERSION" ]]
          [[ "$(sed -n 's/^appVersion: //p' charts/steward-run-arc/Chart.yaml | head -1)" == "$INPUT_VERSION" ]]
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            printf 'version=%s\n' "$INPUT_VERSION"
            printf 'image=ghcr.io/%s/steward-run\n' "$owner"
            printf 'tag=bootstrap-%s-%s\n' "$INPUT_VERSION" "${GITHUB_SHA:0:12}"
          } >> "$GITHUB_OUTPUT"

  bootstrap-build-amd64:
    needs: bootstrap-preflight
    runs-on: ${{ vars.STEWARD_RUN_RELEASE_AMD64_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Build and publish native amd64 bootstrap image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ needs.bootstrap-preflight.outputs.image }}:candidate-${{ needs.bootstrap-preflight.outputs.tag }}-amd64
          build-args: |
            VERSION=${{ needs.bootstrap-preflight.outputs.version }}-bootstrap
            REVISION=${{ github.sha }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max,builder-id=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          sbom: generator=docker.io/docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e30c6e3df01b92bc93654d6a9
      - name: Verify patched amd64 bootstrap image
        env:
          IMAGE: ${{ needs.bootstrap-preflight.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == x86_64 ]]
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          # shellcheck disable=SC2016
          docker run --rm --platform linux/amd64 --entrypoint /bin/bash "$IMAGE@$DIGEST" -c \
            'test "$(dpkg-query -W -f=${Version} openssl)" = "3.0.13-0ubuntu3.15" && test "$(dpkg-query -W -f=${Version} libssl3t64)" = "3.0.13-0ubuntu3.15"'

  bootstrap-build-arm64:
    needs: bootstrap-preflight
    runs-on: ${{ vars.STEWARD_RUN_RELEASE_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Build and publish native arm64 bootstrap image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ needs.bootstrap-preflight.outputs.image }}:candidate-${{ needs.bootstrap-preflight.outputs.tag }}-arm64
          build-args: |
            VERSION=${{ needs.bootstrap-preflight.outputs.version }}-bootstrap
            REVISION=${{ github.sha }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max,builder-id=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          sbom: generator=docker.io/docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e30c6e3df01b92bc93654d6a9
      - name: Verify patched arm64 bootstrap image
        env:
          IMAGE: ${{ needs.bootstrap-preflight.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == aarch64 ]]
          docker pull --platform linux/arm64 "$IMAGE@$DIGEST"
          # shellcheck disable=SC2016
          docker run --rm --platform linux/arm64 --entrypoint /bin/bash "$IMAGE@$DIGEST" -c \
            'test "$(dpkg-query -W -f=${Version} openssl)" = "3.0.13-0ubuntu3.15" && test "$(dpkg-query -W -f=${Version} libssl3t64)" = "3.0.13-0ubuntu3.15"'

  bootstrap-publish:
    needs: [bootstrap-preflight, bootstrap-build-amd64, bootstrap-build-arm64]
    runs-on: ${{ vars.STEWARD_RUN_RELEASE_AMD64_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Publish immutable multi-platform bootstrap image
        env:
          IMAGE: ${{ needs.bootstrap-preflight.outputs.image }}
          TAG: ${{ needs.bootstrap-preflight.outputs.tag }}
          AMD64_DIGEST: ${{ needs.bootstrap-build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.bootstrap-build-arm64.outputs.digest }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            printf 'bootstrap tag already exists: %s:%s\n' "$IMAGE" "$TAG" >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$IMAGE:$TAG" \
            "$IMAGE@$AMD64_DIGEST" "$IMAGE@$ARM64_DIGEST"
          docker buildx imagetools inspect "$IMAGE:$TAG" --raw > "$RUNNER_TEMP/bootstrap-index.json"
          node scripts/verify-runnable-image-platforms.mjs \
            "$RUNNER_TEMP/bootstrap-index.json" linux/amd64 linux/arm64
          # shellcheck disable=SC2016
          digest="$(docker buildx imagetools inspect "$IMAGE:$TAG" | awk '$1 == "Digest:" { print $2; exit }')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          {
            printf '## Bootstrap runner image\n\n'
            printf '`%s@%s`\n' "$IMAGE" "$digest"
          } >> "$GITHUB_STEP_SUMMARY"

  preflight:
    if: ${{ inputs.operation != 'bootstrap' }}
    runs-on: ${{ vars.STEWARD_RUN_RELEASE_AMD64_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.refs.outputs.version }}
      image: ${{ steps.refs.outputs.image }}
      chart: ${{ steps.refs.outputs.chart }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Validate release and public coordinates
        id: refs
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RESUME_IMAGE_DIGEST: ${{ inputs.resume_image_digest }}
          RESUME_CHART_DIGEST: ${{ inputs.resume_chart_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$INPUT_VERSION" == "$VERSION" ]]
          else
            [[ -z "$INPUT_VERSION" ]]
          fi
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          [[ "$default_branch" =~ ^[A-Za-z0-9._/-]+$ ]]
          main_status="$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...refs/heads/$default_branch" --jq .status)"
          [[ "$main_status" == "identical" || "$main_status" == "ahead" ]]
          [[ "$(node -p 'require("./package.json").version')" == "$VERSION" ]]
          [[ "$(sed -n 's/^version: //p' charts/steward-run-arc/Chart.yaml | head -1)" == "$VERSION" ]]
          [[ "$(sed -n 's/^appVersion: //p' charts/steward-run-arc/Chart.yaml | head -1)" == "$VERSION" ]]
          [[ -f "docs/release-notes-v$VERSION.md" ]]
          # The installation example must retain these two literal variable names.
          # shellcheck disable=SC2016
          grep -Fq 'RELEASE_IDENTITY="https://github.com/$RELEASE_REPOSITORY/.github/workflows/portable-release.yml@refs/tags/$RELEASE_TAG"' docs/installation.md
          action_metadata="$(cat action.yml)"
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          grep -Fq "failure-category:" <<<"$action_metadata"
          grep -Fq "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" <<<"$action_metadata"
          grep -Fq "if: steps.node24.outputs.available != 'true'" <<<"$action_metadata"
          grep -Fq "package-manager-cache: false" <<<"$action_metadata"
          for workflow in steward-task.yml steward-task-self-hosted.yml steward-task-customer.yml; do
            grep -Fq 'repository: $''{{ job.workflow_repository }}' ".github/workflows/$workflow"
            grep -Fq 'ref: $''{{ job.workflow_sha }}' ".github/workflows/$workflow"
            grep -Fq 'uses: ./.steward-run-action' ".github/workflows/$workflow"
          done
          grep -Fq "failure-category:" .github/workflows/steward-task.yml
          grep -Fq "failure-category:" .github/workflows/steward-task-self-hosted.yml
          job_container_image="$(sed -n 's/^[[:space:]]*image: \(ghcr.io\/[^[:space:]]*\)$/\1/p' \
            .github/workflows/steward-task.yml)"
          [[ "$job_container_image" =~ ^ghcr\.io/$owner/steward-run@sha256:[a-f0-9]{64}$ ]]
          if [[ "$owner" != "apelogic-ai" ]]; then
            ! grep -Fq "github.com/apelogic-ai/steward-run" \
              charts/steward-run-arc/Chart.yaml charts/steward-run-arc/README.md
            ! grep -Fq "repositoryID: b580a641-1bdf-4ff1-ad22-8a64a6cc696a" \
              charts/steward-run-arc/artifacthub-repo.yml
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            printf 'release v%s already exists\n' "$VERSION" >&2
            exit 1
          fi
          if [[ -n "$RESUME_IMAGE_DIGEST" || -n "$RESUME_CHART_DIGEST" ]]; then
            [[ "$RESUME_IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
            [[ "$RESUME_CHART_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          fi
          {
            printf 'version=%s\n' "$VERSION"
            printf 'image=ghcr.io/%s/steward-run\n' "$owner"
            printf 'chart=ghcr.io/%s/charts/steward-run-arc\n' "$owner"
          } >> "$GITHUB_OUTPUT"

  build-amd64:
    if: ${{ inputs.resume_image_digest == '' && inputs.resume_chart_digest == '' }}
    needs: preflight
    runs-on: ${{ vars.STEWARD_RUN_RELEASE_AMD64_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build and publish native amd64 candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ needs.preflight.outputs.image }}:candidate-${{ needs.preflight.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}-amd64
          build-args: |
            VERSION=${{ needs.preflight.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max,builder-id=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          sbom: generator=docker.io/docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

  build-arm64:
    if: ${{ inputs.resume_image_digest == '' && inputs.resume_chart_digest == '' }}
    needs: preflight
    runs-on: ${{ vars.STEWARD_RUN_RELEASE_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build and publish native arm64 candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ needs.preflight.outputs.image }}:candidate-${{ needs.preflight.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}-arm64
          build-args: |
            VERSION=${{ needs.preflight.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max,builder-id=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          sbom: generator=docker.io/docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9

  publish:
    if: >-
      ${{
        always() &&
        needs.preflight.result == 'success' &&
        (
          (inputs.resume_image_digest != '' && inputs.resume_chart_digest != '') ||
          (needs.build-amd64.result == 'success' && needs.build-arm64.result == 'success')
        )
      }}
    permissions:
      contents: write
      packages: write
      id-token: write
    needs: [preflight, build-amd64, build-arm64]
    runs-on: ${{ vars.STEWARD_RUN_RELEASE_AMD64_RUNNER || 'ubuntu-24.04' }}
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      IMAGE: ${{ needs.preflight.outputs.image }}
      CHART: ${{ needs.preflight.outputs.chart }}
      RESUME_IMAGE_DIGEST: ${{ inputs.resume_image_digest }}
      RESUME_CHART_DIGEST: ${{ inputs.resume_chart_digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4.3.1
        with:
          version: v3.17.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - name: Install pinned ORAS
        env:
          ORAS_VERSION: 1.3.3
          ORAS_LINUX_AMD64_SHA256: 9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59
        run: |
          set -euo pipefail
          archive="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl -sSLo "$RUNNER_TEMP/$archive" "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/$archive"
          printf '%s  %s\n' "$ORAS_LINUX_AMD64_SHA256" "$RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/oras-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/oras-bin" oras
          printf '%s\n' "$RUNNER_TEMP/oras-bin" >> "$GITHUB_PATH"
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Validate version tag state
        run: |
          set -euo pipefail
          image_descriptor="$(oras manifest fetch --descriptor "$IMAGE:$VERSION" 2>/dev/null || true)"
          chart_descriptor="$(oras manifest fetch --descriptor "$CHART:$VERSION" 2>/dev/null || true)"
          if [[ -n "$RESUME_IMAGE_DIGEST" ]]; then
            [[ "$(jq -r '.digest // empty' <<<"$image_descriptor")" == "$RESUME_IMAGE_DIGEST" ]]
            [[ "$(jq -r '.digest // empty' <<<"$chart_descriptor")" == "$RESUME_CHART_DIGEST" ]]
          elif [[ -n "$image_descriptor" || -n "$chart_descriptor" ]]; then
            printf 'version tag already exists; published artifacts are immutable\n' >&2
            exit 1
          fi
      - name: Publish image and chart
        run: |
          set -euo pipefail
          if [[ -n "$RESUME_IMAGE_DIGEST" ]]; then
            helm pull "oci://$CHART" --version "$VERSION" --destination "$RUNNER_TEMP"
          else
            docker buildx imagetools create --tag "$IMAGE:$VERSION" \
              "$IMAGE@${{ needs.build-amd64.outputs.digest }}" \
              "$IMAGE@${{ needs.build-arm64.outputs.digest }}"
            npm run check:vendored-chart
            helm package charts/steward-run-arc --destination "$RUNNER_TEMP"
            helm push "$RUNNER_TEMP/steward-run-arc-$VERSION.tgz" \
              "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          fi
          oras push "$CHART:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            "charts/steward-run-arc/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml"
          artifacthub_descriptor="$(oras manifest fetch --descriptor "$CHART:artifacthub.io")"
          [[ "$(jq -r '.digest // empty' <<<"$artifacthub_descriptor")" =~ ^sha256:[a-f0-9]{64}$ ]]
          image_digest="$(oras manifest fetch --descriptor "$IMAGE:$VERSION" | jq -r '.digest')"
          chart_digest="$(oras manifest fetch --descriptor "$CHART:$VERSION" | jq -r '.digest')"
          [[ "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$chart_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          if [[ -n "$RESUME_IMAGE_DIGEST" ]]; then
            [[ "$image_digest" == "$RESUME_IMAGE_DIGEST" ]]
            [[ "$chart_digest" == "$RESUME_CHART_DIGEST" ]]
          fi
          docker buildx imagetools inspect "$IMAGE@$image_digest" --raw > "$RUNNER_TEMP/image-index.json"
          node scripts/verify-runnable-image-platforms.mjs "$RUNNER_TEMP/image-index.json" linux/amd64 linux/arm64
          oras cp --to-oci-layout "$IMAGE@$image_digest" "$RUNNER_TEMP/release-image:v$VERSION"
          node scripts/verify-release-attestations.mjs \
            "$RUNNER_TEMP/image-index.json" "$RUNNER_TEMP/release-image" "$image_digest" \
            "$RUNNER_TEMP/release-attestation-summary.json" linux/amd64 linux/arm64
          printf 'IMAGE_DIGEST=%s\nCHART_DIGEST=%s\n' "$image_digest" "$chart_digest" >> "$GITHUB_ENV"
      - name: Sign immutable OCI artifacts
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -euo pipefail
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/portable-release.yml@$GITHUB_REF"
          cosign sign --yes --bundle "$RUNNER_TEMP/image-signature.sigstore.json" \
            --registry-referrers-mode=oci-1-1 "$IMAGE@$IMAGE_DIGEST"
          cosign sign --yes --bundle "$RUNNER_TEMP/chart-signature.sigstore.json" \
            --registry-referrers-mode=oci-1-1 "$CHART@$CHART_DIGEST"
          cosign verify --experimental-oci11=true --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE@$IMAGE_DIGEST"
          cosign verify --experimental-oci11=true --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$CHART@$CHART_DIGEST"
      - name: Publish immutable OSS handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp scripts/arc-controller-identity.mjs "$RUNNER_TEMP/arc-controller-identity.mjs"
          cp scripts/steward-run-arc-preflight.mjs "$RUNNER_TEMP/steward-run-arc-preflight.mjs"
          chart_package="steward-run-arc-$VERSION.tgz"
          chart_sha256="$(sha256sum "$RUNNER_TEMP/$chart_package" | cut -d ' ' -f 1)"
          identity_sha256="$(sha256sum "$RUNNER_TEMP/arc-controller-identity.mjs" | cut -d ' ' -f 1)"
          preflight_sha256="$(sha256sum "$RUNNER_TEMP/steward-run-arc-preflight.mjs" | cut -d ' ' -f 1)"
          attestation_sha256="$(sha256sum "$RUNNER_TEMP/release-attestation-summary.json" | cut -d ' ' -f 1)"
          jq -n --arg version "$VERSION" --arg commit "$GITHUB_SHA" \
            --arg workflow_repository "$GITHUB_REPOSITORY" \
            --arg workflow_commit "$GITHUB_SHA" --arg action_commit "$GITHUB_SHA" \
            --arg image "$IMAGE@$IMAGE_DIGEST" --arg chart "$CHART@$CHART_DIGEST" \
            --arg chart_package "$chart_package" --arg chart_sha256 "$chart_sha256" \
            --arg identity_sha256 "$identity_sha256" --arg preflight_sha256 "$preflight_sha256" \
            --arg attestation_sha256 "$attestation_sha256" \
            '{
              schemaVersion:3,
              version:$version,
              commit:$commit,
              workflowRepository:$workflow_repository,
              workflowCommit:$workflow_commit,
              actionCommit:$action_commit,
              image:$image,
              chart:$chart,
              platforms:["linux/amd64","linux/arm64"],
              arcControllerVersion:"0.14.2",
              attestations:{format:"buildkit-embedded-oci",githubArtifactAttestations:false,provenance:"https://slsa.dev/provenance/v1",sbom:"https://spdx.dev/Document",summaryAsset:"release-attestation-summary.json"},
              signatures:{imageBundle:"image-signature.sigstore.json",chartBundle:"chart-signature.sigstore.json"},
              assets:{
                ($chart_package):{sha256:$chart_sha256},
                "arc-controller-identity.mjs":{sha256:$identity_sha256},
                "steward-run-arc-preflight.mjs":{sha256:$preflight_sha256},
                "release-attestation-summary.json":{sha256:$attestation_sha256}
              }
            }' \
            > "$RUNNER_TEMP/oss-release-manifest.json"
          (
            cd "$RUNNER_TEMP"
            sha256sum "$chart_package" arc-controller-identity.mjs steward-run-arc-preflight.mjs \
              release-attestation-summary.json oss-release-manifest.json > SHA256SUMS
          )
          cosign sign-blob --yes --bundle "$RUNNER_TEMP/oss-release-manifest.sigstore.json" \
            "$RUNNER_TEMP/oss-release-manifest.json"
          cosign sign-blob --yes --bundle "$RUNNER_TEMP/SHA256SUMS.sigstore.json" \
            "$RUNNER_TEMP/SHA256SUMS"
          cp "docs/release-notes-v$VERSION.md" "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<EOF

          ## Published artifacts

          Public standalone OSS runner image and Helm chart with immutable
          coordinates, tag-bound keyless signatures, embedded BuildKit SLSA
          provenance and SPDX SBOM predicates, and checksums in
          oss-release-manifest.json. These are embedded OCI attestations, not
          GitHub artifact attestations; verify the signatures with Cosign and
          the exact refs/tags/v$VERSION workflow identity documented in the
          installation guide. Run the released read-only ARC preflight before
          registration; it prints no Secret or token data.

          Sanitized success example:
          PASS ARC 0.14.2 controller arc-system/arc-gha-rs-controller
          PASS controller ServiceAccount arc-system/arc-gha-rs-controller
          EOF
          release_assets="$RUNNER_TEMP/public-release-assets"
          mkdir "$release_assets"
          cp \
            "$RUNNER_TEMP/oss-release-manifest.json" \
            "$RUNNER_TEMP/oss-release-manifest.sigstore.json" \
            "$RUNNER_TEMP/SHA256SUMS" \
            "$RUNNER_TEMP/SHA256SUMS.sigstore.json" \
            "$RUNNER_TEMP/release-attestation-summary.json" \
            "$RUNNER_TEMP/image-signature.sigstore.json" \
            "$RUNNER_TEMP/chart-signature.sigstore.json" \
            "$RUNNER_TEMP/arc-controller-identity.mjs" \
            "$RUNNER_TEMP/steward-run-arc-preflight.mjs" \
            "$RUNNER_TEMP/$chart_package" \
            "$release_assets/"
          node scripts/check-public-release-assets.mjs \
            "$release_assets" "$RUNNER_TEMP/release-notes.md"
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            --title "steward-run v$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$release_assets/oss-release-manifest.json" \
            "$release_assets/oss-release-manifest.sigstore.json" \
            "$release_assets/SHA256SUMS" \
            "$release_assets/SHA256SUMS.sigstore.json" \
            "$release_assets/release-attestation-summary.json" \
            "$release_assets/image-signature.sigstore.json" \
            "$release_assets/chart-signature.sigstore.json" \
            "$release_assets/arc-controller-identity.mjs" \
            "$release_assets/steward-run-arc-preflight.mjs" \
            "$release_assets/$chart_package"
