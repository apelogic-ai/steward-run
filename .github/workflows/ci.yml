name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Scan Git history for leaked values
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source . --no-banner
      - name: Build thin ARC image
        run: >-
          docker build --platform linux/amd64
          --build-arg VERSION=0.3.0-ci
          --build-arg REVISION="$GITHUB_SHA"
          --tag steward-run:ci .
      - name: Smoke-test ARC and governed job-container contracts
        run: >-
          docker run --rm --platform linux/amd64 --entrypoint /bin/bash steward-run:ci
          -v "${{ github.workspace }}:/workspace:ro"
          -c 'test "$(id -un)" = runner && test -x /home/runner/run.sh && test -d /home/runner/k8s && ! command -v curl && ! command -v docker && ! command -v dockerd && ! command -v runc && command -v node && command -v git && command -v tar && /home/runner/externals/node20/bin/node --version && node /workspace/dist/index.cjs'
      - name: Export image vulnerability report
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "${{ github.workspace }}:/report"
          aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          image --scanners vuln --format json --output /report/trivy-report.json steward-run:ci
      - name: Enforce critical vulnerability policy
        run: >-
          node scripts/check-vulnerability-report.mjs
          trivy-report.json
          security/vulnerability-policy.json
          vulnerability-summary.json
      - name: Publish vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: steward-run-vulnerability-report-${{ github.sha }}
          path: |
            trivy-report.json
            vulnerability-summary.json
          if-no-files-found: error
