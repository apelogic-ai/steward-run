name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Scan Git history for leaked values
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/repo"
          -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source . --no-banner
      - name: Build thin ARC image
        run: >-
          docker build --platform linux/amd64
          --build-arg VERSION=0.1.0-ci
          --build-arg REVISION="$GITHUB_SHA"
          --tag steward-run:ci .
      - name: Smoke-test ARC contracts
        run: >-
          docker run --rm --platform linux/amd64 --entrypoint /bin/bash steward-run:ci
          -c 'test "$(id -un)" = runner && test -x /home/runner/run.sh && test -d /home/runner/k8s && node --version'
      - name: Scan image vulnerabilities
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          image --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1 steward-run:ci
