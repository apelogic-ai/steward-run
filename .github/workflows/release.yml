name: Release image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish, without the v prefix
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  IMAGE_REPOSITORY: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}
  COSIGN_EXPERIMENTAL: "1"
  ACTION_COMMIT: 5ef90e86d5e87946372bd3283154a3998eda45f7

jobs:
  prepare:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      candidate-prefix: ${{ steps.release.outputs.candidate-prefix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate release request
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(node -p 'require("./package.json").version')" == "$REQUESTED_VERSION" ]]
          [[ "$ACTION_COMMIT" =~ ^[0-9a-f]{40}$ && "$ACTION_COMMIT" != "$GITHUB_SHA" ]]
          gh api "repos/$GITHUB_REPOSITORY/commits/$ACTION_COMMIT" --silent
          grep -Fq "uses: apelogic-ai/steward-run@$ACTION_COMMIT" .github/workflows/steward-task.yml
          grep -Fq "uses: apelogic-ai/steward-run@$ACTION_COMMIT" .github/workflows/steward-task-self-hosted.yml
          if [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]; then
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$REQUESTED_VERSION" --jq length)" == 0 ]]
            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$REQUESTED_VERSION" --silent 2>/dev/null; then
              echo "release v$REQUESTED_VERSION already exists" >&2
              exit 1
            fi
          fi
          echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "candidate-prefix=candidate-$REQUESTED_VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
      - name: Reject an existing semantic image tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          existing="$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$VERSION" --query 'images[0].imageId.imageDigest' --output text)"
          if [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]; then
            [[ "$existing" == None ]]
          fi

  build-children:
    permissions:
      contents: read
      id-token: write
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            hostArchitecture: x86_64
            runner: ubuntu-24.04
          - architecture: arm64
            hostArchitecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate-prefix }}-${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Require the native worker architecture
        run: '[[ "$(uname -m)" == "${{ matrix.hostArchitecture }}" ]]'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
      - run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - name: Verify governed job-container image
        if: ${{ matrix.architecture == 'amd64' }}
        run: >-
          docker run --rm --entrypoint /bin/bash -v "${{ github.workspace }}:/workspace:ro"
          663383948333.dkr.ecr.us-east-1.amazonaws.com/steward-run@sha256:27235891b596debb1d8bba5f7763e14a56ce4435e2fc82f3de80122b19ff8c61
          -c 'test "$(id -un)" = runner && command -v node && command -v git && command -v tar && /home/runner/externals/node20/bin/node --version && node /workspace/dist/index.cjs'
      - name: Build and publish native candidate child
        run: |
          docker buildx build \
            --platform linux/${{ matrix.architecture }} \
            --build-arg "VERSION=$VERSION" --build-arg "REVISION=$GITHUB_SHA" \
            --build-arg "SOURCE_REPOSITORY=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE_REPOSITORY:$CANDIDATE_TAG" \
            --attest "type=provenance,mode=max,builder-id=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --attest "type=sbom,generator=docker.io/docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9" \
            --metadata-file child-metadata.json --output type=registry \
            --output type=oci,dest=release-image.oci.tar .
      - name: Verify the published native child and attestations
        run: |
          digest="$(node -e 'process.stdout.write(require("./child-metadata.json")["containerimage.digest"])')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "CANDIDATE_DIGEST=$digest" >> "$GITHUB_ENV"
          published="$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$CANDIDATE_TAG" --query 'images[0].imageId.imageDigest' --output text)"
          [[ "$published" == "$digest" ]]
          docker buildx imagetools inspect "$IMAGE_REPOSITORY@$digest" \
            --raw > registry-index-manifest.json
          mkdir release-image-oci
          tar -xf release-image.oci.tar -C release-image-oci
          node scripts/verify-runnable-image-platforms.mjs registry-index-manifest.json linux/${{ matrix.architecture }}
          node scripts/verify-release-attestations.mjs registry-index-manifest.json release-image-oci "$digest" \
            child-attestation-summary.json linux/${{ matrix.architecture }}
      - name: Smoke-test the native candidate child
        run: >-
          docker run --rm --entrypoint /bin/bash -v "${{ github.workspace }}:/workspace:ro"
          "$IMAGE_REPOSITORY@$CANDIDATE_DIGEST"
          -c 'test "$(id -un)" = runner && test -x /home/runner/run.sh && test -d /home/runner/k8s && sudo -n true && sudo -n apt-get check && ! command -v curl && ! command -v docker && ! command -v dockerd && ! command -v runc && command -v node && command -v git && command -v jq && command -v python3 && command -v tar && command -v unzip && /home/runner/bin/Runner.Listener --version && ldd /home/runner/bin/Runner.Listener >/dev/null && ! ldd /home/runner/bin/Runner.Listener | grep -F "not found" && /home/runner/externals/node20/bin/node --version && node /workspace/dist/index.cjs'
      - name: Scan the native runnable child
        run: |
          runnable="$(node scripts/resolve-runnable-image-digest.mjs registry-index-manifest.json linux "${{ matrix.architecture }}")"
          aws ecr wait image-scan-complete --repository-name "$ECR_REPOSITORY" --image-id "imageDigest=$runnable"
          aws ecr describe-image-scan-findings --repository-name "$ECR_REPOSITORY" \
            --image-id "imageDigest=$runnable" --output json > ecr-image-scan-findings.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: steward-run-release-child-${{ matrix.architecture }}-${{ github.run_id }}
          path: |
            child-metadata.json
            child-attestation-summary.json
            ecr-image-scan-findings.json
            registry-index-manifest.json
            release-image.oci.tar
          if-no-files-found: error
          overwrite: true

  publish:
    permissions:
      contents: write
      id-token: write
    needs: [prepare, build-children]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate-prefix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=docker.io/moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: steward-run-release-child-amd64-${{ github.run_id }}
          path: child-amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: steward-run-release-child-arm64-${{ github.run_id }}
          path: child-arm64
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
      - run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - name: Assemble and publish the exact release-index candidate
        run: |
          mkdir child-amd64/oci child-arm64/oci
          tar -xf child-amd64/release-image.oci.tar -C child-amd64/oci
          tar -xf child-arm64/release-image.oci.tar -C child-arm64/oci
          digest="$(node scripts/assemble-release-index.mjs release-image-oci release-index-manifest.json \
            release-metadata.json linux/amd64=child-amd64/oci linux/arm64=child-arm64/oci)"
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          node scripts/verify-runnable-image-platforms.mjs release-index-manifest.json linux/amd64 linux/arm64
          node scripts/verify-release-attestations.mjs release-index-manifest.json release-image-oci "$digest" \
            release-attestation-summary.json linux/amd64 linux/arm64
          published="$(aws ecr put-image --repository-name "$ECR_REPOSITORY" --image-tag "$CANDIDATE_TAG" \
            --image-manifest file://release-index-manifest.json --query 'image.imageId.imageDigest' --output text)"
          [[ "$published" == "$digest" ]]
          docker buildx imagetools inspect "$IMAGE_REPOSITORY@$digest" \
            --raw > registry-index-manifest.json
          node scripts/verify-release-attestations.mjs registry-index-manifest.json release-image-oci "$digest" \
            release-attestation-summary.json linux/amd64 linux/arm64
      - name: Bind completed scans to the release index
        run: |
          for architecture in amd64 arm64; do
            runnable="$(node scripts/resolve-runnable-image-digest.mjs release-index-manifest.json linux "$architecture")"
            [[ "$architecture" == amd64 ]] && summary=ecr-image-scan-summary.json || summary="ecr-image-scan-summary-$architecture.json"
            node scripts/write-ecr-scan-summary.mjs "child-$architecture/ecr-image-scan-findings.json" "$summary" \
              "$ECR_REPOSITORY" "$IMAGE_DIGEST" "$runnable" "$architecture"
          done
      - name: Bind action and workflow commits to the image digest
        run: >-
          node scripts/write-release-manifest.mjs release-metadata.json release-manifest.json "$VERSION"
          "$ACTION_COMMIT" "$GITHUB_SHA" "$IMAGE_REPOSITORY"
          "663383948333.dkr.ecr.us-east-1.amazonaws.com/steward-run@sha256:27235891b596debb1d8bba5f7763e14a56ce4435e2fc82f3de80122b19ff8c61"
      - name: Prepare resumable release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_api="repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION"
          if gh api "$release_api" > release-record.json 2>/dev/null; then
            :
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f "tag_name=v$VERSION" -f "target_commitish=$GITHUB_SHA" \
              -f "name=steward-run v$VERSION" \
              -f body='Verified native linux/amd64 and linux/arm64 release with per-platform scan, provenance, SPDX, OCI 1.1 signature, and immutable handoff.' \
              -F draft=true > release-record.json
          fi
          [[ "$(jq -r .tag_name release-record.json)" == "v$VERSION" ]]
          [[ "$(jq -r .target_commitish release-record.json)" == "$GITHUB_SHA" ]]
          release_id="$(jq -r .id release-record.json)"
          release_draft="$(jq -r .draft release-record.json)"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          [[ "$release_draft" == true || "$release_draft" == false ]]
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"
          echo "RELEASE_DRAFT=$release_draft" >> "$GITHUB_ENV"

          mkdir -p existing-release-assets
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" > release-assets.json
          for asset in \
            release-manifest.json release-manifest.sigstore.json image-signature.sigstore.json \
            release-attestation-summary.json release-attestation-summary.sigstore.json \
            ecr-image-scan-summary.json ecr-image-scan-summary.sigstore.json \
            ecr-image-scan-summary-arm64.json ecr-image-scan-summary-arm64.sigstore.json \
            release-metadata.json; do
            count="$(jq --arg name "$asset" '[.[] | select(.name == $name)] | length' release-assets.json)"
            [[ "$count" -le 1 ]]
            if [[ "$count" == 1 ]]; then
              asset_id="$(jq -r --arg name "$asset" '.[] | select(.name == $name) | .id' release-assets.json)"
              gh api -H 'Accept: application/octet-stream' \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "existing-release-assets/$asset"
            fi
          done
          for artifact in release-manifest release-attestation-summary ecr-image-scan-summary ecr-image-scan-summary-arm64 release-metadata; do
            if [[ -f "existing-release-assets/$artifact.json" ]]; then
              cmp "$artifact.json" "existing-release-assets/$artifact.json"
            fi
          done
      - name: Sign and verify immutable release artifacts
        run: |
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          if [[ -f existing-release-assets/image-signature.sigstore.json ]]; then
            cp existing-release-assets/image-signature.sigstore.json image-signature.sigstore.json
            cosign bundle inspect image-signature.sigstore.json >/dev/null
          else
            cosign sign --yes --bundle image-signature.sigstore.json --registry-referrers-mode=oci-1-1 "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          fi
          verified=false
          for attempt in {1..6}; do
            if cosign verify --experimental-oci11=true --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE_REPOSITORY@$IMAGE_DIGEST"; then verified=true; break; fi
            [[ "$attempt" -eq 6 ]] || sleep 10
          done
          [[ "$verified" == true ]]
          for artifact in release-manifest release-attestation-summary ecr-image-scan-summary ecr-image-scan-summary-arm64; do
            if [[ -f "existing-release-assets/$artifact.sigstore.json" ]]; then
              cp "existing-release-assets/$artifact.sigstore.json" "$artifact.sigstore.json"
            else
              cosign sign-blob --yes --bundle "$artifact.sigstore.json" "$artifact.json"
            fi
            cosign verify-blob --bundle "$artifact.sigstore.json" --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$artifact.json"
          done
      - name: Stage exact draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            release-manifest.json release-manifest.sigstore.json image-signature.sigstore.json
            release-attestation-summary.json release-attestation-summary.sigstore.json
            ecr-image-scan-summary.json ecr-image-scan-summary.sigstore.json
            ecr-image-scan-summary-arm64.json ecr-image-scan-summary-arm64.sigstore.json
            release-metadata.json
          )
          for asset in "${assets[@]}"; do
            if [[ -f "existing-release-assets/$asset" ]]; then
              cmp "$asset" "existing-release-assets/$asset"
            else
              [[ "$RELEASE_DRAFT" == true ]]
              gh release upload "v$VERSION" "$asset"
            fi
          done

          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" > staged-release-assets.json
          expected="$(printf '%s\n' "${assets[@]}" | jq -R . | jq -s 'sort')"
          actual="$(jq '[.[].name] | sort' staged-release-assets.json)"
          [[ "$actual" == "$expected" ]]
          mkdir -p staged-release-assets
          for asset in "${assets[@]}"; do
            asset_id="$(jq -r --arg name "$asset" '.[] | select(.name == $name) | .id' staged-release-assets.json)"
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "staged-release-assets/$asset"
            expected_digest="$(sha256sum "$asset" | cut -d ' ' -f 1)"
            actual_digest="$(sha256sum "staged-release-assets/$asset" | cut -d ' ' -f 1)"
            [[ "$actual_digest" == "$expected_digest" ]]
          done
      - name: Promote verified candidate to semantic image tag
        run: |
          existing="$(aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$VERSION" --query 'images[0].imageId.imageDigest' --output text)"
          if [[ "$existing" == None ]]; then
            published="$(aws ecr put-image --repository-name "$ECR_REPOSITORY" --image-tag "$VERSION" \
              --image-manifest file://release-index-manifest.json --query 'image.imageId.imageDigest' --output text)"
            [[ "$published" == "$IMAGE_DIGEST" ]]
          else
            [[ "$existing" == "$IMAGE_DIGEST" ]]
          fi
      - name: Publish the exact staged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release-before-publish.json
          [[ "$(jq -r .tag_name release-before-publish.json)" == "v$VERSION" ]]
          [[ "$(jq -r .target_commitish release-before-publish.json)" == "$GITHUB_SHA" ]]
          if [[ "$(jq -r .draft release-before-publish.json)" == true ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F draft=false > release-after-publish.json
          else
            cp release-before-publish.json release-after-publish.json
          fi
          [[ "$(jq -r .draft release-after-publish.json)" == false ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" --jq .sha)" == "$GITHUB_SHA" ]]
      - name: Record immutable handoff
        run: |
          {
            echo "## Immutable release handoff"
            echo "- Action commit: \`$ACTION_COMMIT\`"
            echo "- Reusable workflow: \`$GITHUB_REPOSITORY/.github/workflows/steward-task.yml@$GITHUB_SHA\`"
            echo "- ARC runner image: \`$IMAGE_REPOSITORY@$IMAGE_DIGEST\`"
            echo "- Governed job-container image: \`663383948333.dkr.ecr.us-east-1.amazonaws.com/steward-run@sha256:27235891b596debb1d8bba5f7763e14a56ce4435e2fc82f3de80122b19ff8c61\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && hashFiles('release-metadata.json') != '' }}
        with:
          name: steward-run-${{ needs.prepare.outputs.version }}-metadata
          path: |
            release-metadata.json
            release-manifest.json
            release-manifest.sigstore.json
            image-signature.sigstore.json
            release-attestation-summary.json
            release-attestation-summary.sigstore.json
            ecr-image-scan-summary.json
            ecr-image-scan-summary.sigstore.json
            ecr-image-scan-summary-arm64.json
            ecr-image-scan-summary-arm64.sigstore.json
          if-no-files-found: error
