name: Release image

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Validate semantic release tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Authenticate to ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - name: Build and publish immutable version
        shell: bash
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$GITHUB_SHA" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$VERSION" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file release-metadata.json \
            --push .
      - name: Bind action commit and image digest
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
        run: |
          node scripts/write-release-manifest.mjs \
            release-metadata.json \
            release-manifest.json \
            "$VERSION" \
            "$GITHUB_SHA" \
            "$IMAGE_REPOSITORY"
          image_digest="$(node -e 'const metadata = require("./release-metadata.json"); process.stdout.write(metadata["containerimage.digest"])')"
          echo "IMAGE_REPOSITORY=$IMAGE_REPOSITORY" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"
      - name: Sign and verify immutable release artifacts
        shell: bash
        run: |
          certificate_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign sign --yes \
            --bundle image-signature.sigstore.json \
            "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          cosign sign-blob --yes \
            --bundle release-manifest.sigstore.json \
            release-manifest.json
          cosign verify-blob \
            --bundle image-signature.sigstore.json \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_DIGEST"
          registry_verified=false
          for attempt in {1..12}; do
            if cosign verify \
              --experimental-oci11=true \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$IMAGE_REPOSITORY@$IMAGE_DIGEST"; then
              registry_verified=true
              break
            fi
            if [[ "$attempt" -lt 12 ]]; then
              sleep 10
            fi
          done
          [[ "$registry_verified" == true ]]
          cosign verify-blob \
            --bundle release-manifest.sigstore.json \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release-manifest.json
      - name: Attach immutable release handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            release-manifest.json \
            release-manifest.sigstore.json \
            image-signature.sigstore.json \
            release-metadata.json \
            --clobber
          {
            echo "## Immutable release handoff"
            echo "- Action commit: \`$GITHUB_SHA\`"
            echo "- Runner image: \`$IMAGE_REPOSITORY@$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: steward-run-${{ env.VERSION }}-metadata
          path: |
            release-metadata.json
            release-manifest.json
            release-manifest.sigstore.json
            image-signature.sigstore.json
          if-no-files-found: error
