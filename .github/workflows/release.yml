name: Release image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish, without the v prefix
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_REPOSITORY: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}
      COSIGN_EXPERIMENTAL: "1"
      ACTION_COMMIT: b114d38dd6d4c300a7bf80ec16567027dd5d4be1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate release request
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(node -p 'require("./package.json").version')" == "$REQUESTED_VERSION" ]]
          [[ "$ACTION_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ACTION_COMMIT" != "$GITHUB_SHA" ]]
          gh api "repos/$GITHUB_REPOSITORY/commits/$ACTION_COMMIT" --silent
          grep -Fq "uses: apelogic-ai/steward-run@$ACTION_COMMIT" \
            .github/workflows/steward-task.yml
          existing_tags="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$REQUESTED_VERSION" \
            --jq 'length')"
          if [[ "$existing_tags" != 0 ]]; then
            echo "tag v$REQUESTED_VERSION already exists" >&2
            exit 1
          fi
          if gh release view "v$REQUESTED_VERSION" >/dev/null 2>&1; then
            echo "release v$REQUESTED_VERSION already exists" >&2
            exit 1
          fi
          echo "VERSION=$REQUESTED_VERSION" >> "$GITHUB_ENV"
          echo "CANDIDATE_TAG=candidate-$REQUESTED_VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
      - name: Authenticate to ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - name: Verify governed job-container image
        run: >-
          docker run --rm --platform linux/amd64
          --entrypoint /bin/bash
          -v "${{ github.workspace }}:/workspace:ro"
          663383948333.dkr.ecr.us-east-1.amazonaws.com/steward-run@sha256:27235891b596debb1d8bba5f7763e14a56ce4435e2fc82f3de80122b19ff8c61
          -c 'test "$(id -un)" = runner && command -v node && command -v git && command -v tar && /home/runner/externals/node20/bin/node --version && node /workspace/dist/index.cjs'
      - name: Reject an existing semantic image tag
        shell: bash
        run: |
          existing_digest="$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$VERSION" \
            --query 'images[0].imageId.imageDigest' \
            --output text)"
          [[ "$existing_digest" == None ]]
      - name: Build and publish unique candidate
        shell: bash
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$GITHUB_SHA" \
            --build-arg "SOURCE_REPOSITORY=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE_REPOSITORY:$CANDIDATE_TAG" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file release-metadata.json \
            --push .
      - name: Resolve immutable image digest
        shell: bash
        run: |
          image_digest="$(node -e 'const metadata = require("./release-metadata.json"); process.stdout.write(metadata["containerimage.digest"])')"
          echo "IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"
      - name: Verify exact runnable platform set and smoke each image
        shell: bash
        run: |
          docker buildx imagetools inspect \
            "$IMAGE_REPOSITORY@$IMAGE_DIGEST" \
            --raw > image-index-manifest.json
          node scripts/verify-runnable-image-platforms.mjs \
            image-index-manifest.json linux/amd64 linux/arm64
          for architecture in amd64 arm64; do
            docker run --rm --platform "linux/$architecture" \
              --entrypoint /bin/bash \
              -v "${{ github.workspace }}:/workspace:ro" \
              "$IMAGE_REPOSITORY@$IMAGE_DIGEST" \
              -c 'test "$(id -un)" = runner && test -x /home/runner/run.sh && test -d /home/runner/k8s && sudo -n true && sudo -n apt-get check && ! command -v curl && ! command -v docker && ! command -v dockerd && ! command -v runc && command -v node && command -v git && command -v jq && command -v python3 && command -v tar && command -v unzip && /home/runner/bin/Runner.Listener --version && ldd /home/runner/bin/Runner.Listener >/dev/null && ! ldd /home/runner/bin/Runner.Listener | grep -F "not found" && /home/runner/externals/node20/bin/node --version && node /workspace/dist/index.cjs'
          done
      - name: Require completed ECR scan for every runnable image
        shell: bash
        run: |
          for architecture in amd64 arm64; do
            runnable_digest="$(node scripts/resolve-runnable-image-digest.mjs \
              image-index-manifest.json linux "$architecture")"
            if [[ "$architecture" == amd64 ]]; then
              findings_path=ecr-image-scan-findings.json
              summary_path=ecr-image-scan-summary.json
            else
              findings_path="ecr-image-scan-findings-$architecture.json"
              summary_path="ecr-image-scan-summary-$architecture.json"
            fi
            aws ecr wait image-scan-complete \
              --repository-name "$ECR_REPOSITORY" \
              --image-id "imageDigest=$runnable_digest"
            aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id "imageDigest=$runnable_digest" \
              --output json > "$findings_path"
            node scripts/write-ecr-scan-summary.mjs \
              "$findings_path" \
              "$summary_path" \
              "$ECR_REPOSITORY" \
              "$IMAGE_DIGEST" \
              "$runnable_digest" \
              "$architecture"
          done
      - name: Bind action and workflow commits to the image digest
        shell: bash
        run: |
          node scripts/write-release-manifest.mjs \
            release-metadata.json \
            release-manifest.json \
            "$VERSION" \
            "$ACTION_COMMIT" \
            "$GITHUB_SHA" \
            "$IMAGE_REPOSITORY" \
            "663383948333.dkr.ecr.us-east-1.amazonaws.com/steward-run@sha256:27235891b596debb1d8bba5f7763e14a56ce4435e2fc82f3de80122b19ff8c61"
      - name: Sign and verify immutable release artifacts
        shell: bash
        run: |
          certificate_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          cosign sign --yes \
            --bundle image-signature.sigstore.json \
            --registry-referrers-mode=oci-1-1 \
            "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          cosign verify-blob \
            --bundle image-signature.sigstore.json \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_DIGEST"
          registry_verified=false
          for attempt in {1..6}; do
            if cosign verify \
              --experimental-oci11=true \
              --certificate-identity "$certificate_identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$IMAGE_REPOSITORY@$IMAGE_DIGEST"; then
              registry_verified=true
              break
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep 10
            fi
          done
          [[ "$registry_verified" == true ]]
          cosign sign-blob --yes \
            --bundle release-manifest.sigstore.json \
            release-manifest.json
          cosign verify-blob \
            --bundle release-manifest.sigstore.json \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            release-manifest.json
          cosign sign-blob --yes \
            --bundle ecr-image-scan-summary.sigstore.json \
            ecr-image-scan-summary.json
          cosign verify-blob \
            --bundle ecr-image-scan-summary.sigstore.json \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ecr-image-scan-summary.json
          cosign sign-blob --yes \
            --bundle ecr-image-scan-summary-arm64.sigstore.json \
            ecr-image-scan-summary-arm64.json
          cosign verify-blob \
            --bundle ecr-image-scan-summary-arm64.sigstore.json \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ecr-image-scan-summary-arm64.json
      - name: Promote verified candidate to semantic image tag
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_REPOSITORY:$VERSION" \
            "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          published_digest="$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$VERSION" \
            --query 'images[0].imageId.imageDigest' \
            --output text)"
          [[ "$published_digest" == "$IMAGE_DIGEST" ]]
      - name: Create verified release and immutable handoff
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "steward-run v$VERSION" \
            --notes "Verified in-cluster Steward integration release for linux/amd64 and linux/arm64 with an OCI 1.1 image signature, completed per-platform ECR scan evidence, provenance, SBOM, and immutable GitOps handoff." \
            release-manifest.json \
            release-manifest.sigstore.json \
            image-signature.sigstore.json \
            ecr-image-scan-summary.json \
            ecr-image-scan-summary.sigstore.json \
            ecr-image-scan-summary-arm64.json \
            ecr-image-scan-summary-arm64.sigstore.json \
            release-metadata.json
          {
            echo "## Immutable release handoff"
            echo "- Action commit: \`$ACTION_COMMIT\`"
            echo "- Reusable workflow: \`$GITHUB_REPOSITORY/.github/workflows/steward-task.yml@$GITHUB_SHA\`"
            echo "- ARC runner image: \`$IMAGE_REPOSITORY@$IMAGE_DIGEST\`"
            echo "- Governed job-container image: \`663383948333.dkr.ecr.us-east-1.amazonaws.com/steward-run@sha256:27235891b596debb1d8bba5f7763e14a56ce4435e2fc82f3de80122b19ff8c61\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() && hashFiles('release-metadata.json') != '' }}
        with:
          name: steward-run-${{ env.VERSION }}-metadata
          path: |
            release-metadata.json
            release-manifest.json
            release-manifest.sigstore.json
            image-signature.sigstore.json
            ecr-image-scan-summary.json
            ecr-image-scan-summary.sigstore.json
            ecr-image-scan-summary-arm64.json
            ecr-image-scan-summary-arm64.sigstore.json
          if-no-files-found: error
