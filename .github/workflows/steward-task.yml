name: Governed Steward task

on:
  workflow_call:
    inputs:
      runner-label:
        description: Runner label for the governed job
        required: true
        type: string
      job-timeout-minutes:
        description: Maximum governed-job duration in whole minutes (1-360)
        required: false
        type: number
        default: 15
      runtime-binding-timeout-minutes:
        description: Maximum Steward runtime-binding wait in minutes (1-360)
        required: false
        type: number
        default: 10
      workflow:
        description: Existing governed Workflow reference; mutually exclusive with invocation-path
        required: false
        type: string
        default: ""
      envelope-digest:
        description: Optional exact active User Envelope selector for either Task source
        required: false
        type: string
        default: ""
      invocation-path:
        description: Repository-relative direct-package invocation manifest path; mutually exclusive with workflow
        required: false
        type: string
        default: ""
      input-artifact:
        description: Artifact whose contents are materialized under in/
        required: true
        type: string
      output-artifact:
        description: Artifact created from out/
        required: true
        type: string
      steward-api-url:
        description: Steward Task API base URL
        required: true
        type: string
      identity-exchange-url:
        description: Deprecated compatibility exchange endpoint; empty discovers from Steward
        required: false
        type: string
        default: ""
      identity-exchange-audience:
        description: Exact audience for identity-exchange-url; omission uses a deprecated compatibility default
        required: false
        type: string
        default: ""
      steward-ca-certificate-file:
        description: Deprecated compatibility CA path; empty uses system trust
        required: false
        type: string
        default: ""
      agent-runtime:
        description: Existing AgentRuntime UID to adopt for the existing Workflow path only
        required: false
        type: string
        default: ""
    outputs:
      outcome:
        description: Action result, exactly success or failure
        value: ${{ jobs.governed.outputs.outcome }}
      failure-category:
        description: Bounded steward-run failure category; empty on success
        value: ${{ jobs.governed.outputs.failure-category }}
      http-status:
        description: HTTP status for a classified Steward or Identity exchange failure; empty otherwise
        value: ${{ jobs.governed.outputs.http-status }}
      status:
        description: Terminal Steward Task phase
        value: ${{ jobs.governed.outputs.status }}
      task-uid:
        description: Steward Task UID
        value: ${{ jobs.governed.outputs.task-uid }}
      runtime-uid:
        description: AgentRuntime UID
        value: ${{ jobs.governed.outputs.runtime-uid }}

jobs:
  governed:
    runs-on: ${{ inputs.runner-label }}
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    container:
      image: ghcr.io/apelogic-ai/steward-run@sha256:bd6d7b4ef4cf2658096d5c2bfbc0fec6d7790c478832cf374cff4218338c86b9
    permissions:
      contents: read
      id-token: write
    outputs:
      outcome: ${{ steps.task.outputs.outcome }}
      failure-category: ${{ steps.task.outputs.failure-category }}
      http-status: ${{ steps.task.outputs.http-status }}
      status: ${{ steps.task.outputs.status }}
      task-uid: ${{ steps.task.outputs.task-uid }}
      runtime-uid: ${{ steps.task.outputs.runtime-uid }}
    steps:
      - name: Validate job timeout
        shell: bash
        env:
          JOB_TIMEOUT_MINUTES: ${{ inputs.job-timeout-minutes }}
        run: |
          set -euo pipefail
          if [[ ! "$JOB_TIMEOUT_MINUTES" =~ ^[0-9]+$ ]] ||
             (( JOB_TIMEOUT_MINUTES < 1 || JOB_TIMEOUT_MINUTES > 360 )); then
            echo "::error::job-timeout-minutes must be an integer from 1 through 360"
            exit 1
          fi
      - id: caller-source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: inputs.invocation-path != ''
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reserve the trusted action checkout path
        shell: bash
        env:
          ACTION_CHECKOUT_PATH: .steward-run-action
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if [[ -L "$ACTION_CHECKOUT_PATH" ]]; then
            echo "::error::trusted action checkout path must not be a symlink"
            exit 1
          fi
          if [[ ! -e "$ACTION_CHECKOUT_PATH" ]]; then
            exit 0
          fi
          if [[ ! -d "$ACTION_CHECKOUT_PATH" ]]; then
            echo "::error::trusted action checkout path exists but is not a directory"
            exit 1
          fi
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1 &&
             git ls-files --error-unmatch -- "$ACTION_CHECKOUT_PATH" "$ACTION_CHECKOUT_PATH/**" >/dev/null 2>&1; then
            echo "::error::trusted action checkout path is tracked by the caller repository"
            exit 1
          fi
          expected_origin="$WORKFLOW_SERVER_URL/$WORKFLOW_REPOSITORY"
          actual_origin="$(git -C "$ACTION_CHECKOUT_PATH" remote get-url origin 2>/dev/null || true)"
          if [[ "$actual_origin" != "$expected_origin" && "$actual_origin" != "$expected_origin.git" ]]; then
            echo "::error::refusing to remove an action checkout path not owned by this reusable workflow"
            exit 1
          fi
          rm -rf -- "$ACTION_CHECKOUT_PATH"
      - id: workflow-source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .steward-run-action
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.input-artifact }}
          path: in
      - id: task
        uses: ./.steward-run-action
        with:
          workflow: ${{ inputs.workflow }}
          envelope-digest: ${{ inputs.envelope-digest }}
          invocation-path: ${{ inputs.invocation-path }}
          inputs: in
          outputs: out
          steward-api-url: ${{ inputs.steward-api-url }}
          identity-exchange-url: ${{ inputs.identity-exchange-url }}
          identity-exchange-audience: ${{ inputs.identity-exchange-audience }}
          steward-ca-certificate-file: ${{ inputs.steward-ca-certificate-file }}
          agent-runtime: ${{ inputs.agent-runtime }}
          runtime-binding-timeout-minutes: ${{ inputs.runtime-binding-timeout-minutes }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.output-artifact }}
          path: out
          if-no-files-found: error
